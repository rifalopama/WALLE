    <circle r="9" fill="#1678ED"/>
  </g>

  <!-- Wallet clasp -->
  <rect x="77" y="56" width="29" height="23"
        rx="7" fill="#0B2550"/>
  <rect x="82" y="60" width="24" height="15"
        rx="5" fill="url(#blue)"/>
  <circle cx="94" cy="67.5" r="4" fill="#FFFFFF"/>

  <!-- Growth arrow -->
  <path d="M69 39 L80 28 L87 33 L108 11"
