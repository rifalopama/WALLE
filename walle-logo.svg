
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#075BEB"/>
    </linearGradient>
  </defs>

  <!-- Wallet -->
  <path d="M22 39 L53 39 L67 25 L81 39 L91 39
           Q103 39 103 52 L103 87
           Q103 98 91 98 L26 98
